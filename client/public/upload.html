<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scene Photo Upload — OpenFirehouse</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'SF Pro',Arial,sans-serif; background:#0a0a0a; color:#fff; min-height:100vh; display:flex; flex-direction:column; }
  .header { background:linear-gradient(135deg,#991b1b,#7f1d1d); padding:14px 16px; text-align:center; }
  .header h1 { font-size:15px; font-weight:900; }
  .header p { font-size:11px; color:#fca5a5; margin-top:2px; }
  .main { flex:1; display:flex; flex-direction:column; padding:12px; gap:12px; }
  .capture-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1a1a1a; border:2px dashed #444; border-radius:16px; padding:24px; min-height:200px; }
  .capture-area.has-photo { border-style:solid; border-color:#dc2626; }
  .capture-area img { max-width:100%; max-height:300px; border-radius:12px; margin-bottom:12px; }
  .btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-capture { background:#dc2626; color:white; font-size:18px; }
  .btn-capture:active { background:#b91c1c; }
  .btn-upload { background:#16a34a; color:white; }
  .btn-upload:active { background:#15803d; }
  .btn-upload:disabled { opacity:0.4; }
  .field { margin-bottom:8px; }
  .field label { display:block; font-size:10px; color:#666; margin-bottom:3px; font-weight:600; }
  .field input { width:100%; background:#222; border:1px solid #444; border-radius:8px; padding:8px 10px; color:#fff; font-size:13px; }
  .success { background:#16a34a; border-radius:12px; padding:16px; text-align:center; }
  .success h2 { font-size:16px; margin-bottom:4px; }
  .success p { font-size:12px; color:#bbf7d0; }
  .count { font-size:11px; color:#888; text-align:center; }
  .footer { padding:8px; text-align:center; font-size:9px; color:#555; }
  .footer a { color:#dc2626; text-decoration:none; font-weight:700; }
  input[type="file"] { display:none; }
</style>
</head>
<body>
<div class="header">
  <h1>📷 Scene Photo Upload</h1>
  <p id="subtitle">Tap to take a photo — it uploads to the incident automatically</p>
</div>
<div class="main">
  <!-- Capture area -->
  <div class="capture-area" id="captureArea" onclick="document.getElementById('fileInput').click()">
    <div id="preview"></div>
    <div id="placeholder">
      <p style="font-size:48px;margin-bottom:8px">📸</p>
      <p style="font-size:14px;font-weight:700">Tap to take a photo</p>
      <p style="font-size:11px;color:#666;margin-top:4px">Camera will open — snap and upload</p>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*" capture="environment" onchange="handleFile(this)" />

  <!-- Form fields -->
  <div id="formFields" style="display:none">
    <div class="field">
      <label>Your Name</label>
      <input id="uploaderName" placeholder="FF Smith" />
    </div>
    <div class="field">
      <label>Caption (optional)</label>
      <input id="caption" placeholder="Origin area, 2nd floor bedroom" />
    </div>
    <button class="btn btn-upload" id="uploadBtn" onclick="uploadPhoto()" disabled>
      ⬆️ Upload Photo
    </button>
  </div>

  <!-- Success message -->
  <div class="success" id="successMsg" style="display:none">
    <h2>✅ Uploaded!</h2>
    <p>Photo sent to the Command Board.</p>
    <button class="btn btn-capture" onclick="resetForm()" style="margin-top:12px;font-size:14px">
      📷 Take Another
    </button>
  </div>

  <div class="count" id="countMsg"></div>
</div>
<div class="footer">
  Powered by <a href="https://openfirehouse.com">OpenFirehouse</a> — Photos are tagged with GPS and timestamp
</div>

<script>
const path = window.location.pathname;
const token = path.split('/upload/')[1] || path.split('/').pop();
const API_BASE = window.location.origin.includes('vercel')
  ? 'https://freestation-app-production.vercel.app'
  : window.location.origin;

let selectedFile = null;
let uploadCount = 0;

function handleFile(input) {
  if (!input.files.length) return;
  selectedFile = input.files[0];

  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById('preview');
    if (selectedFile.type.startsWith('video/')) {
      preview.innerHTML = `<video src="${e.target.result}" controls style="max-width:100%;max-height:250px;border-radius:12px"></video>`;
    } else {
      preview.innerHTML = `<img src="${e.target.result}" />`;
    }
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('captureArea').classList.add('has-photo');
    document.getElementById('formFields').style.display = 'block';
    document.getElementById('uploadBtn').disabled = false;
  };
  reader.readAsDataURL(selectedFile);
}

async function uploadPhoto() {
  if (!selectedFile) return;
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Uploading...';

  const formData = new FormData();
  formData.append('photo', selectedFile);
  formData.append('uploaded_by', document.getElementById('uploaderName').value || 'Scene Personnel');
  formData.append('caption', document.getElementById('caption').value || '');

  // Try to get GPS
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
    });
    formData.append('latitude', pos.coords.latitude);
    formData.append('longitude', pos.coords.longitude);
  } catch (_) {}

  try {
    const res = await fetch(`${API_BASE}/api/incident-media/upload/${token}`, {
      method: 'POST',
      body: formData,
    });
    if (!res.ok) {
      const err = await res.json();
      alert(err.error || 'Upload failed');
      btn.disabled = false;
      btn.textContent = '⬆️ Upload Photo';
      return;
    }
    uploadCount++;
    document.getElementById('formFields').style.display = 'none';
    document.getElementById('captureArea').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('countMsg').textContent = `${uploadCount} photo${uploadCount > 1 ? 's' : ''} uploaded this session`;
  } catch (e) {
    alert('Upload failed: ' + e.message);
    btn.disabled = false;
    btn.textContent = '⬆️ Upload Photo';
  }
}

function resetForm() {
  selectedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('preview').innerHTML = '';
  document.getElementById('placeholder').style.display = 'block';
  document.getElementById('captureArea').classList.remove('has-photo');
  document.getElementById('captureArea').style.display = 'flex';
  document.getElementById('formFields').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
  document.getElementById('uploadBtn').disabled = true;
  document.getElementById('uploadBtn').textContent = '⬆️ Upload Photo';
  document.getElementById('caption').value = '';
}
</script>
</body>
</html>
