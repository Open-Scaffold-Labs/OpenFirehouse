<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="128" cy="128" r="120" fill="#1B3A5C"/>
  <!-- Robot body -->
  <g transform="translate(128,128)">
    <!-- Helmet -->
    <path d="M-45,-55 Q-45,-80 0,-85 Q45,-80 45,-55 L45,-40 Q45,-30 35,-30 L-35,-30 Q-45,-30 -45,-40 Z" fill="#dc2626"/>
    <!-- Helmet badge -->
    <rect x="-12" y="-72" width="24" height="14" rx="3" fill="#fbbf24"/>
    <text x="0" y="-62" text-anchor="middle" font-family="Arial" font-weight="900" font-size="9" fill="#1B3A5C">14</text>
    <!-- Helmet brim -->
    <rect x="-50" y="-35" width="100" height="8" rx="4" fill="#b91c1c"/>
    <!-- Face plate -->
    <rect x="-35" y="-25" width="70" height="45" rx="10" fill="#0f2440"/>
    <!-- Eyes (glowing) -->
    <circle cx="-14" cy="-5" r="10" fill="#22d3ee" opacity="0.9"/>
    <circle cx="14" cy="-5" r="10" fill="#22d3ee" opacity="0.9"/>
    <circle cx="-14" cy="-5" r="5" fill="white"/>
    <circle cx="14" cy="-5" r="5" fill="white"/>
    <!-- Mouth (speaker grille) -->
    <rect x="-15" y="10" width="30" height="3" rx="1.5" fill="#22d3ee" opacity="0.5"/>
    <rect x="-12" y="15" width="24" height="3" rx="1.5" fill="#22d3ee" opacity="0.3"/>
    <!-- Turnout coat -->
    <rect x="-40" y="22" width="80" height="50" rx="8" fill="#78716c"/>
    <rect x="-38" y="35" width="76" height="4" rx="2" fill="#fbbf24"/>
    <rect x="-38" y="42" width="76" height="4" rx="2" fill="#fbbf24"/>
    <!-- SCBA straps -->
    <rect x="-30" y="24" width="8" height="48" rx="2" fill="#444" opacity="0.5"/>
    <rect x="22" y="24" width="8" height="48" rx="2" fill="#444" opacity="0.5"/>
    <!-- Antenna -->
    <rect x="30" y="-90" width="4" height="25" rx="2" fill="#888"/>
    <circle cx="32" cy="-92" r="4" fill="#dc2626">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
