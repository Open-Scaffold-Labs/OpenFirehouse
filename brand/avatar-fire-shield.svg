<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="100%" style="stop-color:#0f2440"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#2563eb" stroke-width="4"/>
  <!-- Maltese cross simplified -->
  <g transform="translate(128,128) scale(0.7)">
    <path d="M0,-80 L25,-25 80,0 25,25 0,80 -25,25 -80,0 -25,-25 Z" fill="url(#flame)" opacity="0.9"/>
    <path d="M0,-60 L18,-18 60,0 18,18 0,60 -18,18 -60,0 -18,-18 Z" fill="#1B3A5C"/>
    <circle cx="0" cy="0" r="28" fill="url(#flame)" opacity="0.8"/>
  </g>
  <!-- Text -->
  <text x="128" y="132" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-weight="900" font-size="28" fill="white">OF</text>
</svg>
